services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: awdf_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: awdf_tasks
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Node.js + Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awdf_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Important: Uses Docker Compose service DNS name 'mongodb'
      - MONGO_URI=mongodb://mongodb:27017/awdf_tasks
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # 3. React + Vite Frontend UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: awdf_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network

# Named volume for persistent MongoDB storage across container restarts
volumes:
  mongodb_data:
    driver: local

# Isolated bridge network for inter-container communication
networks:
  app-network:
    driver: bridge
